name: Build Android APK

# Génère l'APK Android de Devis Sap Sap.
# - Sur un tag "vX.Y.Z" : build + publication d'une Release GitHub avec l'APK joint.
# - Manuellement (workflow_dispatch) : build + artifact téléchargeable, sans release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android project
        # android/ n'est pas versionné (il est généré, pas écrit à la main) :
        # flutter create ajoute le dossier manquant sans toucher à lib/ ni pubspec.yaml.
        run: flutter create --org com.devissapsap --project-name devis_sap_sap --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK for upload
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev-$GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/devis-sap-sap-${version}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devis-sap-sap-apk
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Devis Sap Sap ${{ github.ref_name }}
          generate_release_notes: true

name: Build Android APK

# Génère l'APK Android de Devis Sap Sap et publie une Release GitHub avec
# l'APK joint : sur un tag "vX.Y.Z", ou manuellement (workflow_dispatch,
# utile quand on ne peut pas pousser de tag directement).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nom de la version publiée (ex: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android project
        # android/ n'est pas versionné (il est généré, pas écrit à la main) :
        # flutter create ajoute le dossier manquant sans toucher à lib/ ni pubspec.yaml.
        run: flutter create --org com.devissapsap --project-name devis_sap_sap --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # La clé Gemini (assistant IA) est injectée ici depuis un secret du
        # dépôt, jamais écrite dans le code source : voir lib/config/ai_config.dart.
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK for upload
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/devis-sap-sap-${{ steps.version.outputs.tag }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devis-sap-sap-apk
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          name: Devis Sap Sap ${{ steps.version.outputs.tag }}
          generate_release_notes: true
